<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="materialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe685"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <filter id="materialShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4a044e" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Circular Badge -->
  <circle cx="50" cy="50" r="44" fill="url(#materialBg)" stroke="#f0abfc" stroke-width="2.5" filter="url(#materialShadow)"/>
  
  <!-- Inner Subtle Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#e879f9" stroke-width="1.2" stroke-dasharray="3, 3"/>

  <!-- Open Textbook Body -->
  <g transform="translate(50, 48)">
    <!-- Book Outer Cover Backing -->
    <path d="M0,18 C-12,14 -24,14 -34,18 L-34,-16 C-24,-20 -12,-20 0,-16 C12,-20 24,-20 34,-16 L34,18 C24,14 12,14 0,18 Z" fill="url(#bookCover)"/>
    
    <!-- Left Pages Stack -->
    <path d="M-1,16 C-12,12 -23,12 -32,15 L-32,-17 C-23,-20 -12,-20 -1,-17 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Right Pages Stack -->
    <path d="M1,16 C12,12 23,12 32,15 L32,-17 C23,-20 12,-20 1,-17 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Center Binding Spine Line -->
    <line x1="0" y1="-17" x2="0" y2="17" stroke="#475569" stroke-width="2"/>

    <!-- Left Page Practice Lines -->
    <line x1="-27" y1="-10" x2="-8" y2="-10" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-27" y1="-3" x2="-8" y2="-3" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-27" y1="4" x2="-8" y2="4" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-27" y1="10" x2="-14" y2="10" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Right Page Practice Lines -->
    <line x1="8" y1="-10" x2="27" y2="-10" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="8" y1="-3" x2="27" y2="-3" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="8" y1="4" x2="27" y2="4" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="8" y1="10" x2="20" y2="10" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Golden Bookmark Ribbon Hanging -->
    <path d="M0,-17 L0,22 L-3,19 L-6,22 L-6,-17 Z" fill="url(#goldSeal)"/>
  </g>

  <!-- Golden Copyright / Proprietary Seal Badge -->
  <circle cx="70" cy="30" r="7" fill="url(#goldSeal)" stroke="#ffffff" stroke-width="1.2"/>
  <path d="M70,25.5 L71.5,28.5 L74.5,29 L72,31 L73,34 L70,32.5 L67,34 L68,31 L65.5,29 L68.5,28.5 Z" fill="#000000"/>
</svg>
