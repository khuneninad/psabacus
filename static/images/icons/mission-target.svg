<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="missionGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe685"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="missionShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#f5a623" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Target Background with Glow -->
  <circle cx="50" cy="50" r="44" fill="#fffbeb" stroke="#fef3c7" stroke-width="2"/>
  <circle cx="50" cy="50" r="34" fill="#ffffff" stroke="url(#missionGold)" stroke-width="2.5" stroke-dasharray="4, 3" filter="url(#missionShadow)"/>
  
  <!-- Compass Points / Star of Knowledge -->
  <g transform="translate(50, 50)" fill="url(#missionGold)">
    <!-- North -->
    <polygon points="0,-24 5,-6 0,0 -5,-6"/>
    <!-- South -->
    <polygon points="0,24 5,6 0,0 -5,6"/>
    <!-- East -->
    <polygon points="24,0 6,5 0,0 6,-5"/>
    <!-- West -->
    <polygon points="-24,0 -6,5 0,0 -6,-5"/>
  </g>

  <!-- Central Core Light -->
  <circle cx="50" cy="50" r="7" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="3" fill="#ffe270"/>
</svg>
