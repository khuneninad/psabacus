<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="pinShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#dc2626" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Glowing Ground Shadow / Radiance Ring -->
  <ellipse cx="50" cy="84" rx="20" ry="5" fill="#fecaca" opacity="0.8"/>
  <ellipse cx="50" cy="84" rx="12" ry="3" fill="#ef4444" opacity="0.4"/>

  <!-- High-Precision Location Map Pin -->
  <path d="M50,15 C33,15 20,28 20,45 C20,64 45,82 50,85 C55,82 80,64 80,45 C80,28 67,15 50,15 Z" 
        fill="url(#pinGrad)" filter="url(#pinShadow)"/>

  <!-- White Center Medallion Inside Pin -->
  <circle cx="50" cy="42" r="16" fill="#ffffff"/>

  <!-- Coaching Center / School Academy Building Silhouette Inside -->
  <g transform="translate(50, 42)">
    <!-- Roof / Gable -->
    <polygon points="0,-10 11,-2 -11,-2" fill="#dc2626"/>
    <!-- Pillars -->
    <rect x="-9" y="-1" width="3" height="8" fill="#1e293b"/>
    <rect x="-2" y="-1" width="4" height="8" fill="#1e293b"/>
    <rect x="6" y="-1" width="3" height="8" fill="#1e293b"/>
    <!-- Foundation Base -->
    <rect x="-11" y="7" width="22" height="2.5" rx="0.5" fill="#1e293b"/>
  </g>
</svg>
