<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="clockGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe484"/>
      <stop offset="40%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="clockShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#f5a623" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Golden Gear / Laurel Frame -->
  <circle cx="50" cy="50" r="44" fill="#ffffff" stroke="url(#clockGold)" stroke-width="4.5" filter="url(#clockShadow)"/>
  
  <!-- Minute Tick Marks Around Rim -->
  <circle cx="50" cy="50" r="37" fill="none" stroke="#fed7aa" stroke-width="1.5" stroke-dasharray="2, 6"/>

  <!-- Hour Pointers (12, 3, 6, 9) -->
  <rect x="48.5" y="15" width="3" height="6" rx="1" fill="#f5a623"/>
  <rect x="79" y="48.5" width="6" height="3" rx="1" fill="#f5a623"/>
  <rect x="48.5" y="79" width="3" height="6" rx="1" fill="#f5a623"/>
  <rect x="15" y="48.5" width="6" height="3" rx="1" fill="#f5a623"/>

  <!-- Clock Hands (Showing Dynamic Time) -->
  <!-- Hour Hand -->
  <line x1="50" y1="50" x2="35" y2="40" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Minute Hand pointing towards 12 -->
  <line x1="50" y1="50" x2="50" y2="25" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Second Hand in vibrant gold -->
  <line x1="50" y1="53" x2="65" y2="38" stroke="#f5a623" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Central Pivot Pin -->
  <circle cx="50" cy="50" r="4.5" fill="url(#clockGold)"/>
  <circle cx="50" cy="50" r="2" fill="#0f172a"/>

  <!-- Milestone Star at Top Right -->
  <path d="M72,20 L73.5,23.5 L77,24 L74.5,26.5 L75,30 L72,28 L69,30 L69.5,26.5 L67,24 L70.5,23.5 Z" fill="#f5a623"/>
</svg>
