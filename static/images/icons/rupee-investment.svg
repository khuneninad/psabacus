<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="rupeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="goldCoins" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#881337" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Circular Badge -->
  <circle cx="50" cy="50" r="44" fill="url(#badgeBg)" stroke="#fecdd3" stroke-width="2.5" filter="url(#badgeShadow)"/>
  
  <!-- Inner Subtle Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#fda4af" stroke-width="1.2" stroke-dasharray="3, 3"/>

  <!-- Indian Rupee Symbol (₹) Bold & Stylized -->
  <g fill="url(#rupeeGrad)">
    <!-- Top Horizontal Bar 1 -->
    <rect x="33" y="27" width="34" height="4.5" rx="2.25"/>
    <!-- Top Horizontal Bar 2 -->
    <rect x="33" y="37" width="26" height="4.5" rx="2.25"/>
    
    <!-- Curved Spine of ₹ -->
    <path d="M42,27 L42,42 C54,42 63,44 63,53 C63,62 54,64 42,64 L42,59 C50,59 56,57 56,53 C56,48 50,46 42,46 L42,42 Z"/>
    
    <!-- Vertical Stem -->
    <rect x="39.5" y="27" width="5" height="45" rx="2"/>

    <!-- Slanted Diagonal Leg -->
    <path d="M42,58 L63,78 L56,80 L38,62 Z"/>
  </g>

  <!-- Small Rising Prosperity Star -->
  <path d="M68,22 L69.5,18 L71,22 L75,23.5 L71,25 L69.5,29 L68,25 L64,23.5 Z" fill="#eab308"/>
  <circle cx="73" cy="33" r="2" fill="#f5a623"/>
</svg>
