<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe270"/>
      <stop offset="35%" stop-color="#f5a623"/>
      <stop offset="70%" stop-color="#d98e16"/>
      <stop offset="100%" stop-color="#9a6207"/>
    </linearGradient>
    <linearGradient id="innerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#f5a623" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Glow Circle -->
  <circle cx="100" cy="95" r="88" fill="none" stroke="url(#goldRing)" stroke-width="4.5" filter="url(#glow)"/>
  
  <!-- Outer Decorative Beaded Ring -->
  <circle cx="100" cy="95" r="81" fill="none" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="2, 4"/>

  <!-- Inner Dark Blue / Black Shield -->
  <circle cx="100" cy="95" r="76" fill="url(#innerBlue)"/>

  <!-- Laurel Wreath (Left Side) -->
  <g fill="url(#goldRing)" opacity="0.95">
    <path d="M42,95 C41,85 45,76 52,68 C49,75 50,83 54,88 Z"/>
    <path d="M44,78 C45,70 51,62 59,57 C55,63 55,71 58,76 Z"/>
    <path d="M52,62 C55,55 63,48 72,46 C66,51 64,59 66,65 Z"/>
    <path d="M64,50 C69,44 79,40 89,40 C83,44 80,51 81,58 Z"/>
  </g>

  <!-- Laurel Wreath (Right Side) -->
  <g fill="url(#goldRing)" opacity="0.95">
    <path d="M158,95 C159,85 155,76 148,68 C151,75 150,83 146,88 Z"/>
    <path d="M156,78 C155,70 149,62 141,57 C145,63 145,71 142,76 Z"/>
    <path d="M148,62 C145,55 137,48 128,46 C134,51 136,59 134,65 Z"/>
    <path d="M136,50 C131,44 121,40 111,40 C117,44 120,51 119,58 Z"/>
  </g>

  <!-- Open Book Symbol (Core Knowledge) -->
  <g transform="translate(100, 110)">
    <!-- Book Spine & Pages -->
    <path d="M0,-8 C-14,-14 -34,-14 -46,-10 C-48,-4 -48,16 -46,22 C-34,18 -14,18 0,24 C14,18 34,18 46,22 C48,16 48,-4 46,-10 C34,-14 14,-14 0,-8 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M0,-8 L0,24" stroke="#94a3b8" stroke-width="2"/>
    <!-- Page Lines -->
    <path d="M-38, -3 C-28, -6 -15, -6 -6, -2" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-38, 4 C-28, 1 -15, 1 -6, 5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-38, 11 C-28, 8 -15, 8 -6, 12" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    
    <path d="M6, -2 C15, -6 28, -6 38, -3" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M6, 5 C15, 1 28, 1 38, 4" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M6, 12 C15, 8 28, 8 38, 11" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Fountain Pen Nib (Excellence in Learning) -->
  <g transform="translate(100, 68)">
    <path d="M0,-30 L11,0 L8,24 L-8,24 L-11,0 Z" fill="url(#goldRing)" stroke="#78350f" stroke-width="1"/>
    <!-- Pen Nib Inner Detail -->
    <path d="M0,-30 L0,10" stroke="#0f172a" stroke-width="1.8"/>
    <circle cx="0" cy="10" r="2.5" fill="#0f172a"/>
    <path d="M-5,16 L5,16" stroke="#0f172a" stroke-width="1.5"/>
  </g>

  <!-- Monogram "PS" on Shield -->
  <circle cx="100" cy="50" r="14" fill="#0f172a" stroke="url(#goldRing)" stroke-width="1.8"/>
  <text x="100" y="55" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" fill="#ffe270" text-anchor="middle" letter-spacing="1">PS</text>

  <!-- Bottom Ribbon Banner -->
  <g transform="translate(100, 155)">
    <!-- Ribbon Shadow/Folds -->
    <path d="M-75,12 L-60,0 L-60,18 Z" fill="#7f1d1d"/>
    <path d="M75,12 L60,0 L60,18 Z" fill="#7f1d1d"/>
    <!-- Main Ribbon Body -->
    <path d="M-66,-2 C-35,6 35,6 66,-2 L60,20 C30,28 -30,28 -60,20 Z" fill="url(#ribbonGrad)" stroke="url(#goldRing)" stroke-width="1.5"/>
    <text x="0" y="11" font-family="'Outfit', sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">PIYUSHLOK EDUCATION</text>
    <text x="0" y="22" font-family="'Outfit', sans-serif" font-weight="600" font-size="6" fill="#ffe270" text-anchor="middle" letter-spacing="1.5">A JOURNEY TO EXCELLENCE</text>
  </g>
</svg>
